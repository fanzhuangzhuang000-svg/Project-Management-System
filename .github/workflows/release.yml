name: Release

# 打 v* 标签时触发：一次产出三个平台的包，发布成一个 Release。
# 客户去 Releases 页面只下自己那一套，不用把三份都拖走。
#
# 为什么用标签触发而不是手动点：
#   手动发布最常见的翻车是"改了代码忘了重新打包"——
#   标签是对某个 commit 的不可变引用，产物和标签必然指向同一份代码。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（手动触发时填，例如 v1.0.0）'
        required: true

permissions:
  contents: write      # 要能创建 Release

jobs:
  build:
    name: 打三个平台的包
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 前端依赖
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: 取出版本号
        id: ver
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # 标签形如 v1.0.0 → 1.0.0；标签不是 v* 时用 package.json 兜底
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 打交付包
        env:
          PMS_VERSION: ${{ steps.ver.outputs.version }}
        run: node tools/build-artifacts.js

      - name: 校验交付包
        env:
          PMS_VERSION: ${{ steps.ver.outputs.version }}
        run: node tools/verify-artifacts.js

      - name: 列出产物
        run: dir dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          # 必须用 | 块标量：写成多行 plain scalar 会被 YAML 折叠成
          # 一个空格分隔的字符串（"a/*.exe a/*.zip a/*.tar.gz"），
          # 那不是 glob，匹配不到任何文件 —— 而 if-no-files-found 默认
          # 是 warn 不报错，于是"打包成功"一路绿灯骗过去，
          # 直到下一个 job download-artifact 才炸。v1.0.0 就这么挂的。
          path: |
            dist-artifacts/*.exe
            dist-artifacts/*.zip
            dist-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist-artifacts
          # 必须加：download-artifact@v4 给产物里的每个文件各建一个同名
          # 子目录，于是文件落在 dist-artifacts/release-artifacts/x.exe，
          # 下面的检查按 dist-artifacts/*.exe 找，三个 glob 全都匹配不到 ——
          # 明明有 36MB 产物却报"缺少产物"。merge-multiple 平铺回
          # dist-artifacts/。
          merge-multiple: true

      - name: 确认三份产物都在
        run: |
          set -e
          # 用 glob 展开（compgen/数组）取匹配，不要 `ls | head -n1`：
          # 后者在 ls 失败时被 || true 吞掉，把"目录层级不对"和"真的
          # 没产物"报成同一个错，排查时被误导过。
          missing=0
          for pat in '*.exe' '*.zip' '*.tar.gz'; do
            # shellcheck disable=SC2206
            matches=(dist-artifacts/$pat)
            f="${matches[0]:-}"
            if [ -z "$f" ] || [ ! -s "$f" ]; then
              echo "✗ 缺少产物：dist-artifacts/$pat"
              missing=1
            else
              echo "✓ $f  ($(du -h "$f" | cut -f1))"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "产物清单："; ls -la dist-artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 弱电项目管理系统 ${{ inputs.tag || github.ref_name }}
          body: |
            ## 我该下载哪个？

            | 你的情况 | 下载 |
            |---|---|
            | **一台 Windows 电脑，自己用** | `elv-pms-*-windows-standalone.exe` — 双击安装，自带运行环境，不用装 Node |
            | **局域网多人共用 / 服务器** | `elv-pms-*-docker.zip` — 装 Docker Desktop 后解压运行 |
            | **自己的 Linux 服务器** | `elv-pms-*-linux.tar.gz` — `sudo bash deploy/deploy.sh` |

            > 三套是**同一份程序的三种运行方式**，功能一致，**数据互不相通**。
            > 换环境不会带走数据，需要自己备份/迁移。

            ### 默认端口
            - Windows 单机版 `8787`（测试基址，固定）
            - Docker 专业版 `8790`
            - Linux 裸装版 `8899`

            详细说明见仓库 README。
          files: |
            dist-artifacts/*.exe
            dist-artifacts/*.zip
            dist-artifacts/*.tar.gz
          fail_on_unmatched_files: true
